<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>$SIGNAL — Culture Pulse Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="dashboard">
      <header>
        <h1>$SIGNAL</h1>
        <p class="subtitle">culture is the product</p>
      </header>

      <section class="score-panel">
        <div class="score" id="pulse-score">--</div>
        <div class="status" id="pulse-status">Loading...</div>
        <canvas id="waveform" width="800" height="200"></canvas>
      </section>

      <section class="breakdown">
        <h2>Platform Breakdown</h2>
        <div id="platform-bars"></div>
      </section>

      <section class="topics">
        <h2>Top Topics</h2>
        <ul id="topic-list"></ul>
      </section>

      <section class="event" id="event-panel" hidden>
        <h2>Pulse Event</h2>
        <p id="event-name"></p>
      </section>

      <footer>
        <p>Updated: <span id="last-update">--</span></p>
        <p><a href="https://github.com">Methodology</a> · <a href="/forge">Signal Forge</a></p>
      </footer>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
