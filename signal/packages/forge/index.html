<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signal Forge — $SIGNAL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="header">
        <div class="logo">
          <span class="wave-icon"></span>
          <h1>Signal Forge</h1>
        </div>
        <p class="tagline">$SIGNAL // culture is the product</p>
      </header>

      <main class="main">
        <section class="input-section">
          <label for="link-input">Paste a link (X, TikTok, Reddit, YouTube)</label>
          <input
            id="link-input"
            type="url"
            placeholder="https://x.com/..."
            autocomplete="off"
          />
          <label for="title-input">Moment title (optional)</label>
          <input
            id="title-input"
            type="text"
            placeholder="Today's cultural spike"
            autocomplete="off"
          />
          <button id="generate-btn" type="button">Generate Pulse Card</button>
        </section>

        <section class="preview-section">
          <canvas id="card-canvas" width="1200" height="630"></canvas>
          <div class="actions">
            <button id="download-btn" type="button" disabled>Download PNG</button>
            <button id="copy-btn" type="button" disabled>Copy to Clipboard</button>
          </div>
        </section>
      </main>

      <footer class="footer">
        <p>Watermarked with $SIGNAL + latest Pulse Event tx hash</p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
